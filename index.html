<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Taycan Turbo GT Mode</title>
    <style>
        @font-face {
            font-family: 'PorscheNext';
            src: url('https://fonts.cdnfonts.com/css/porsche-next-tt');
        }

        body {
            margin: 0;
            background: radial-gradient(circle at center, #111 0%, #000 100%);
            color: #fff;
            font-family: 'Arial Black', sans-serif; /* 강한 서킷 느낌 */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* 터보 GT 특유의 커브드 게이지 */
        .gauge-box {
            position: relative;
            width: 350px;
            height: 350px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        svg { transform: rotate(-220deg); } /* 시작점 조절 */

        .bg-bar {
            fill: none;
            stroke: #222;
            stroke-width: 12;
            stroke-dasharray: 660; /* 원의 일부만 사용 */
            stroke-linecap: round;
        }

        .speed-bar {
            fill: none;
            stroke: #00e5ff; /* 일렉트릭 블루 */
            stroke-width: 12;
            stroke-dasharray: 660;
            stroke-dashoffset: 660; 
            stroke-linecap: round;
            filter: drop-shadow(0 0 12px #00e5ff);
            transition: stroke-dashoffset 0.2s ease-out;
        }

        .center-info {
            position: absolute;
            text-align: center;
        }

        #speed {
            font-size: 130px;
            font-weight: 900;
            margin: 0;
            line-height: 0.8;
            font-style: italic;
            letter-spacing: -5px;
        }

        .unit {
            font-size: 20px;
            color: #555;
            letter-spacing: 2px;
        }

        /* 하단 레이싱 정보 섹션 */
        .gt-info {
            margin-top: -20px;
            width: 100%;
            max-width: 300px;
            border-top: 1px solid #333;
            padding-top: 20px;
            display: flex;
            justify-content: space-between;
        }

        .label { font-size: 10px; color: #ff3d00; font-weight: bold; margin-bottom: 4px; }
        .value { font-size: 18px; font-weight: bold; color: #eee; }

        .turbo-gt-logo {
            margin-top: 40px;
            font-size: 14px;
            letter-spacing: 8px;
            color: #fff;
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="gauge-box">
        <svg width="350" height="350">
            <circle class="bg-bar" cx="175" cy="175" r="140"></circle>
            <circle id="progress" class="speed-bar" cx="175" cy="175" r="140"></circle>
        </svg>
        <div class="center-info">
            <p id="speed">0</p>
            <span class="unit">KM/H</span>
        </div>
    </div>

    <div class="gt-info">
        <div>
            <div class="label">TOP SPEED</div>
            <div id="top-speed" class="value">0</div>
        </div>
        <div style="text-align: right;">
            <div class="label">ACCURACY</div>
            <div id="accuracy" class="value">0m</div>
        </div>
    </div>

    <div class="turbo-gt-logo">TAYCAN TURBO GT</div>

    <script>
        const speedEl = document.getElementById('speed');
        const progressEl = document.getElementById('progress');
        const topSpeedEl = document.getElementById('top-speed');
        const accEl = document.getElementById('accuracy');

        let maxS = 0;
        const MAX_LIMIT = 50; // 자전거 기준 50km/h를 풀게이지로 설정
        const BAR_LENGTH = 660;

        function update(pos) {
            let s = pos.coords.speed || 0;
            if (s < 0) s = 0;
            const kmh = Math.round(s * 3.6);
            
            // 속도 텍스트
            speedEl.innerText = kmh;

            // 게이지 바 계산
            const offset = BAR_LENGTH - (Math.min(kmh, MAX_LIMIT) / MAX_LIMIT) * BAR_LENGTH;
            progressEl.style.strokeDashoffset = offset;

            // 최고 속도 기록
            if(kmh > maxS) {
                maxS = kmh;
                topSpeedEl.innerText = maxS;
            }

            // 정확도
            accEl.innerText = Math.round(pos.coords.accuracy) + "m";
        }

        if ("geolocation" in navigator) {
            navigator.geolocation.watchPosition(update, null, { enableHighAccuracy: true });
        }
    </script>
</body>
</html>
