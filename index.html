<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Taycan Ultimate Sync</title>
    <style>
        :root {
            --cyan: #00e5ff;
            --bg: #000;
            --panel-bg: rgba(20, 20, 20, 0.8);
        }

        body {
            margin: 0;
            background-color: var(--bg);
            color: white;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .cluster {
            display: grid;
            grid-template-columns: 1fr 1.2fr 1fr;
            width: 100vw;
            height: 100vh;
            align-items: center;
            padding: 0 20px;
            box-sizing: border-box;
            background: radial-gradient(circle at center, #151515 0%, #000 100%);
        }

        /* 공통 원형 다이얼 스타일 */
        .dial {
            position: relative;
            aspect-ratio: 1/1;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.1);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.5);
        }

        /* 중앙 속도계 */
        .center-dial { border: 2px solid rgba(255,255,255,0.2); }
        #speed { font-size: 120px; font-weight: 800; font-style: italic; margin: 0; line-height: 1; }
        .unit { color: #666; font-size: 18px; margin-top: 10px; font-weight: bold; }

        /* 정보 텍스트 스타일 */
        .info-label { color: var(--cyan); font-size: 10px; font-weight: bold; text-transform: uppercase; margin-bottom: 5px; }
        .info-value { font-size: 20px; font-weight: bold; margin-bottom: 15px; }
        .sub-text { color: #888; font-size: 12px; }

        /* 배터리 바 */
        .bat-container { width: 80px; height: 10px; background: #222; border-radius: 5px; overflow: hidden; margin: 10px 0; }
        #bat-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #0f0, #00ff00); transition: width 0.5s; }

        /* 음악 정보 섹션 */
        .music-box { text-align: right; width: 100%; }
        #music-title { font-size: 16px; color: white; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px; }
        #music-artist { font-size: 13px; color: #888; }

        #current-time { position: absolute; top: 10%; right: 10%; font-size: 24px; font-weight: 300; }
    </style>
</head>
<body>

    <div id="current-time">00:00 PM</div>

    <div class="cluster">
        <div class="dial">
            <div class="info-label">Battery</div>
            <div id="bat-text" class="info-value">--%</div>
            <div class="bat-container"><div id="bat-fill"></div></div>
            <div style="margin-top: 20px;">
                <div class="info-label">Top Speed</div>
                <div id="top-speed" class="info-value">0</div>
            </div>
        </div>

        <div class="dial center-dial">
            <div class="sub-text">SET ---</div>
            <div id="speed">0</div>
            <div class="unit">km/h</div>
            <div class="sub-text" style="margin-top: 20px;">● 165 km</div>
        </div>

        <div class="dial">
            <div class="music-box">
                <div class="info-label">Now Playing</div>
                <div id="music-title">No Media</div>
                <div id="music-artist">Waiting for playback...</div>
            </div>
            <div style="margin-top: 40px; text-align: right; width: 100%;">
                <div class="info-label">Distance</div>
                <div id="dist" class="info-value">0.0 km</div>
                <div class="info-label">Accuracy</div>
                <div id="acc" class="info-value">-- m</div>
            </div>
        </div>
    </div>

    <script>
        // 1. 시계 업데이트 루프
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12 || 12;
            document.getElementById('current-time').innerText = `${hours}:${minutes} ${ampm}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // 2. 음악 정보 가져오기 (Media Session API)
        if ('mediaSession' in navigator) {
            setInterval(() => {
                const metadata = navigator.mediaSession.metadata;
                if (metadata) {
                    document.getElementById('music-title').innerText = metadata.title;
                    document.getElementById('music-artist').innerText = metadata.artist;
                }
            }, 1000);
        }

        // 3. 실제 배터리 정보 연동
        if ('getBattery' in navigator) {
            navigator.getBattery().then(battery => {
                function updateBat() {
                    const level = Math.round(battery.level * 100);
                    document.getElementById('bat-text').innerText = level + "%";
                    document.getElementById('bat-fill').style.width = level + "%";
                }
                updateBat();
                battery.addEventListener('levelchange', updateBat);
            });
        }

        // 4. GPS 속도 및 거리
        let totalDist = 0;
        let lastPos = null;
        let topSpeed = 0;

        function updateGPS(pos) {
            const s = Math.round((pos.coords.speed || 0) * 3.6);
            document.getElementById('speed').innerText = s;
            document.getElementById('acc').innerText = Math.round(pos.coords.accuracy) + " m";

            if (s > topSpeed) {
                topSpeed = s;
                document.getElementById('top-speed').innerText = topSpeed;
            }

            if (lastPos) {
                const d = calculateDistance(lastPos.coords.latitude, lastPos.coords.longitude, 
                                          pos.coords.latitude, pos.coords.longitude);
                totalDist += d;
                document.getElementById('dist').innerText = (totalDist / 1000).toFixed(1) + " km";
            }
            lastPos = pos;
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const φ1 = lat1 * Math.PI/180;
            const φ2 = lat2 * Math.PI/180;
            const Δφ = (lat2-lat1) * Math.PI/180;
            const Δλ = (lon2-lon1) * Math.PI/180
