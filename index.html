<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Perfect Taycan 3-Dial Cluster</title>
    <style>
        /* Porsche의 세련된 다크 테마 */
        :root {
            --cyan-glow: #00e5ff;
            --green-battery: #00ff00;
            --grey-text: #666;
            --bg-dark: #020202;
        }

        body {
            margin: 0;
            background-color: var(--bg-dark);
            color: white;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            letter-spacing: -1px;
        }

        /* 3구 클러스터 메인 컨테이너 */
        .cluster-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            background: radial-gradient(circle at center, #111 0%, #000 100%);
        }

        /* 중앙 속도계 */
        .center-dial {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 320px;
            height: 320px;
            z-index: 10;
        }

        .center-dial::after {
            content: '';
            position: absolute;
            width: 310px;
            height: 310px;
            border-radius: 50%;
            background: radial-gradient(circle, #222 0%, #050505 70%);
            box-shadow: inset 0 0 15px rgba(255,255,255,0.05);
            z-index: 5;
        }

        .speed-content {
            text-align: center;
            z-index: 15;
            color: white;
        }

        #speed {
            font-size: 130px;
            font-weight: 800;
            margin: 0;
            line-height: 0.8;
            font-style: italic;
            letter-spacing: -5px;
        }

        .unit {
            font-size: 18px;
            color: #666;
            display: block;
            margin-top: 5px;
            letter-spacing: 2px;
        }

        /* 양옆 정보창 공통 스타일 */
        .side-dial {
            position: relative;
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            padding: 40px;
            box-sizing: border-box;
            color: #888;
            font-size: 12px;
        }

        .left-dial { align-items: flex-start; text-align: left; }
        .right-dial { align-items: flex-end; text-align: right; }

        /* 정보창 디테일 구현 */
        .data-panel { margin-top: auto; }
        .val { color: white; font-weight: bold; font-size: 16px; }
        .label { color: var(--cyan-glow); font-weight: bold; font-size: 10px; }

        /* 좌측 배터리 및 온도 */
        .temp { font-size: 18px; color: white; margin-bottom: 30px; }
        .battery-soc { font-size: 16px; color: var(--cyan-glow); }
        .battery-bar-container {
            width: 100px;
            height: 12px;
            background: #222;
            border-radius: 6px;
            margin: 10px 0;
            overflow: hidden;
        }
        .battery-bar {
            width: 33%; /* 사진과 동일 */
            height: 100%;
            background: linear-gradient(90deg, #0f0, #00ff00);
            border-radius: 6px;
        }

        /* 우측 미디어 정보 복제 및 GPS 데이터 통합 */
        .song-info { margin-top: auto; color: white; }
        .song-title { font-size: 14px; font-weight: bold; line-height: 1.2; }
        .integrated-gps-data {
            margin-top: 30px;
            display: grid;
            grid-template-columns: auto auto;
            gap: 15px;
            color: #ccc;
        }

        /* 하단 최고 속도 */
        .gt-footer {
            position: absolute;
            bottom: 40px;
            width: 100%;
            text-align: center;
            color: white;
            font-weight: bold;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="cluster-container">
        
        <div class="side-dial left-dial">
            <div class="temp">18 <span style="color:#666;">°C</span></div>
            <div class="data-panel">
                <div class="battery-soc">33 %</div>
                <div class="battery-bar-container">
                    <div class="battery-bar"></div>
                </div>
                <div>최고 속도 <br><span id="top-speed" class="val">0</span> km/h</div>
            </div>
        </div>

        <div class="center-dial">
            <div class="speed-content">
                <p id="speed">0</p>
                <span class="unit">KM/H</span>
            </div>
        </div>

        <div class="side-dial right-dial">
            <div class="temp">3:13 PM</div>
            <div class="song-info">
                <div class="song-title">생명의 기억 (いのちの)</div>
                <div style="font-size:12px;">윤소라</div>
            </div>
            <div class="integrated-gps-data">
                <div class="label">DISTANCE</div>
                <div class="label">ACCURACY</div>
                <div id="distance" class="val">0.0<small>km</small></div>
                <div id="accuracy" class="val">0<small>m</small></div>
            </div>
            <div class="label" style="margin-top:auto;">NORMAL</div>
        </div>

    </div>

    <script>
        const speedEl = document.getElementById('speed');
        const distEl = document.getElementById('distance');
        const accEl = document.getElementById('accuracy');
        const topSpeedEl = document.getElementById('top-speed');

        let maxS = 0;
        let lastPos = null;
        let totalD = 0;

        function update(pos) {
            let s = pos.coords.speed || 0;
            if (s < 0) s = 0;
            const kmh = Math.round(s * 3.6);
            
            // 속도 업데이트
            speedEl.innerText = kmh;

            // 거리 계산
            if (lastPos) {
                totalD += calculateDistance(lastPos.coords, pos.coords);
                distEl.innerText = (totalD / 1000).toFixed(1);
            }
            lastPos = pos;
