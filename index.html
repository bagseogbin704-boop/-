<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Taycan Real-Sync Cluster</title>
    <style>
        :root {
            --porsche-cyan: #00e5ff;
            --porsche-green: #00ff00;
            --bg-gradient: radial-gradient(circle at center, #1a1a1a 0%, #000 100%);
        }

        body {
            margin: 0;
            background-color: #000;
            background: var(--bg-gradient);
            color: white;
            font-family: 'Segoe UI', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 1.2fr 1fr;
            width: 95vw;
            height: 80vh;
            align-items: center;
            text-align: center;
        }

        /* 중앙 속도계 */
        .center-dial {
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .gauge-ring {
            position: absolute;
            width: 320px;
            height: 320px;
            border: 4px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            box-shadow: inset 0 0 20px rgba(255,255,255,0.05);
        }

        #speed { font-size: 140px; font-weight: 800; font-style: italic; margin: 0; line-height: 1; }
        .unit { font-size: 18px; color: #666; font-weight: bold; margin-top: 10px; }

        /* 좌측 패널 (배터리 & 온도) */
        .side-panel { display: flex; flex-direction: column; height: 100%; justify-content: space-around; padding: 20px; }
        .left { text-align: left; }
        .right { text-align: right; }

        .temp { font-size: 24px; color: #fff; }
        .battery-val { font-size: 20px; color: var(--porsche-cyan); font-weight: bold; }
        .bar-bg { width: 120px; height: 8px; background: #333; border-radius: 4px; margin: 8px 0; }
        #bar-fill { height: 100%; background: var(--porsche-green); border-radius: 4px; transition: width 0.5s; }

        /* 우측 패널 (시계 & 음악) */
        .clock { font-size: 24px; margin-bottom: 50px; }
        .music-title { font-size: 18px; font-weight: bold; color: var(--porsche-cyan); margin-bottom: 5px; }
        .music-artist { font-size: 14px; color: #888; }

        /* GPS 데이터 하단 배치 */
        .gps-info { margin-top: 30px; font-size: 12px; color: #444; text-transform: uppercase; }
        .gps-val { font-size: 18px; color: #ccc; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <div class="side-panel left">
            <div class="temp">18 <span style="color:#666">°C</span></div>
            <div>
                <div id="bat-level" class="battery-val">-- %</div>
                <div class="bar-bg"><div id="bar-fill" style="width: 0%"></div></div>
                <div class="gps-info">TOP SPEED</div>
                <div id="top-speed" class="gps-val">0 <small>km/h</small></div>
            </div>
        </div>

        <div class="center-dial">
            <div class="gauge-ring"></div>
            <div style="font-size: 12px; color: #444; margin-bottom: 10px;">SET ---</div>
            <div id="speed">0</div>
            <div class="unit">KM/H</div>
            <div style="font-size: 12px; color: #666; margin-top: 20px;">● 165 km</div>
        </div>

        <div class="side-panel right">
            <div id="time" class="clock">00:00 PM</div>
            <div>
                <div id="m-title" class="music-title">No Media</div>
                <div id="m-artist" class="music-artist">Waiting for sync...</div>
                <div style="display: flex; gap: 20px; justify-content: flex-end; margin-top: 30px;">
                    <div><div class="gps-info">DISTANCE</div><div id="dist" class="gps-val">0.0<small>km</small></div></div>
                    <div><div class="gps-info">ACCURACY</div><div id="acc" class="gps-val">0<small>m</small></div></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 1. 실시간 시계 업데이트
        function updateTime() {
            const now = new Date();
            let h = now.getHours();
            const m = String(now.getMinutes()).padStart(2, '0');
            const ampm = h >= 12 ? 'PM' : 'AM';
            h = h % 12 || 12;
            document.getElementById('time').innerText = `${h}:${m} ${ampm}`;
        }
        setInterval(updateTime, 1000); updateTime();

        // 2. 실제 배터리 잔량 연동
        if('getBattery' in navigator) {
            navigator.getBattery().then(bat => {
                const updateBat = () => {
                    const lv = Math.round(bat.level * 100);
                    document.getElementById('bat-level').innerText = lv + " %";
                    document.getElementById('bar-fill').style.width = lv + "%";
                };
                updateBat();
                bat.addEventListener('levelchange', updateBat);
            });
        }

        // 3. 음악 정보 동기화 (MediaSession)
        if ('mediaSession' in navigator) {
            setInterval(() => {
                if (navigator.mediaSession.metadata) {
                    document.getElementById('m-title').innerText = navigator.mediaSession.metadata.title;
                    document.getElementById('m-artist').innerText = navigator.mediaSession.metadata.artist;
                }
            }, 1000);
        }

        // 4. GPS 속도 및 주행 데이터
        let totalD = 0, lastP = null, topS = 0;
        navigator.geolocation.watchPosition(p => {
            const s = Math.round((p.coords.speed || 0) * 3.6);
            document.getElementById('speed').innerText = s;
            document.getElementById('acc').innerText = Math.round(p.coords.accuracy) + "m";
            if(s > topS) { topS = s; document.getElementById('top-speed').innerText = topS; }
            if(lastP) {
                const d = calcDist(lastP.coords, p.coords);
                totalD += d;
                document.getElementById('dist').innerText = (totalD/1000).toFixed(1) + "km";
            }
            lastP = p;
        }, null, {enableHighAccuracy: true});

        function calcDist(c1, c2) {
            const R = 6371e3, p1 = c1.latitude * Math.PI/180, p2 = c2.latitude * Math.PI/180;
            const dp = (c2.latitude-c1.latitude) * Math.PI/180, dl = (c2.longitude-c1.longitude) * Math.PI/180;
            const a = Math.sin(dp/2)**2 + Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
            return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }
    </script>
</body>
</html>
